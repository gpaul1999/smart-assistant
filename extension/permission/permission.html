<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Cấp quyền microphone — Smart Meeting Assistant</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 560px; margin: 60px auto; padding: 0 20px;
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      button {
        padding: 10px 18px; border: 0; border-radius: 10px;
        background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      .ok { color: #16a34a; font-weight: 600; }
      .err { color: #dc2626; }
      .note { opacity: 0.7; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>🎙️ Cấp quyền microphone</h1>
    <p>
      Để ghi lại <strong>giọng nói của bạn</strong> trong cuộc họp (bên cạnh âm thanh của đối
      phương), extension cần quyền truy cập microphone. Chỉ cần cấp <strong>một lần</strong>.
    </p>
    <p class="note">
      Âm thanh chỉ được xử lý và lưu <strong>trên máy của bạn</strong> (IndexedDB) — không gửi đi
      bất kỳ đâu.
    </p>
    <button id="grant">Cấp quyền microphone</button>
    <p id="status"></p>
    <script src="permission.js"></script>
  </body>
</html>
