<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">🎙️</div>
      <div>
        <h1>Smart Meeting Assistant</h1>
        <p class="tagline">Ghi âm · Phiên âm · Dịch · Tóm tắt — 100% local</p>
      </div>
    </header>

    <section id="tab-info" class="card">
      <div class="row">
        <span class="label">Tab hiện tại</span>
        <span id="tab-title" class="value">…</span>
      </div>
      <div class="row">
        <span class="label">Microphone</span>
        <span id="mic-status" class="value">…</span>
        <button id="mic-grant" class="link-btn" hidden>Cấp quyền</button>
      </div>
      <div class="row">
        <span class="label">Lưu trữ</span>
        <span id="quota" class="value">…</span>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <label class="label" for="source-mode">Nguồn âm</label>
        <select id="source-mode">
          <option value="tab">Tab này (họp trong Chrome)</option>
          <option value="system">Hệ thống (app desktop — chọn nguồn mỗi phiên)</option>
          <option value="mic">Chỉ mic (mọi nơi — không nhãn người nói)</option>
        </select>
      </div>
      <div class="row">
        <label class="label" for="target-lang">Dịch sang</label>
        <select id="target-lang">
          <option value="">Không dịch</option>
          <option value="vi">Tiếng Việt</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </div>
      <div class="row">
        <label class="label" for="caption-mode" data-i18n="popCaptionMode">Phụ đề live</label>
        <select id="caption-mode">
          <option value="overlay" data-i18n="popCaptionOverlay">Overlay trong tab họp</option>
          <option value="window" data-i18n="popCaptionWindow">Cửa sổ riêng</option>
          <option value="off" data-i18n="popCaptionOff">Tắt</option>
        </select>
      </div>
      <div class="row">
        <label class="label" for="ephemeral" data-i18n="popEphemeral">Chỉ phụ đề, không lưu</label>
        <input type="checkbox" id="ephemeral" />
      </div>
      <details>
        <summary>Nâng cao</summary>
        <div class="row">
          <label class="label" for="source-lang">Ngôn ngữ cuộc họp</label>
          <select id="source-lang">
            <option value="auto">Tự phát hiện</option>
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh">中文</option>
          </select>
        </div>
        <div class="row">
          <label class="label" for="live-model">Model live</label>
          <select id="live-model">
            <option value="Xenova/whisper-tiny">Whisper Tiny (nhanh)</option>
            <option value="Xenova/whisper-base">Whisper Base</option>
          </select>
        </div>
        <div class="row">
          <button id="prepare-model" class="link-btn">⬇ Chuẩn bị model trước khi họp</button>
          <span id="model-progress" class="value"></span>
        </div>
        <div class="row">
          <input id="license-key" data-i18n-placeholder="popLicensePlaceholder" placeholder="Dán license key Pro…" />
          <span id="license-status" class="value"></span>
        </div>
        <div class="row">
          <label class="label" for="copilot-docset">Copilot tài liệu</label>
          <select id="copilot-docset">
            <option value="">Tắt</option>
          </select>
        </div>
      </details>
    </section>

    <div id="error" class="error" hidden></div>

    <button id="toggle" class="primary" disabled>Bắt đầu ghi</button>
    <div id="rec-status" class="rec-status" hidden>
      <span class="rec-dot"></span>
      <span id="rec-elapsed">00:00</span>
      <span id="rec-title" class="rec-title"></span>
    </div>

    <div id="onboarding-nudge" class="card" hidden>
      <button id="open-onboarding" class="link-btn" data-i18n="popFinishOnboarding">⚙️ Hoàn tất thiết lập ban đầu</button>
    </div>

    <footer>
      <button id="open-viewer" class="link-btn">📚 Thư viện</button>
      <button id="open-docs" class="link-btn">📄 Kho tài liệu</button>
      <button id="open-live-window" class="link-btn" hidden>💬 Phụ đề live</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
